name: Déploiement Automatique OVH

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy to OVH FTP
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Récupération du code
        uses: actions/checkout@v4

      - name: 📂 Synchronisation FTP vers OVH
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          security: loose
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'www/pointdevente/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.vscode/**
            README.md
            pointdevente.sql
            *.conf
